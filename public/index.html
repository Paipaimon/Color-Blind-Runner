<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c11">
  <!-- 站点图标：内联 SVG（四条车道色点），避免额外静态资源请求 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1117'/%3E%3Crect x='7' y='5' width='18' height='4.4' rx='2.2' fill='%23ff4d6d'/%3E%3Crect x='7' y='11.2' width='18' height='4.4' rx='2.2' fill='%2335d07f'/%3E%3Crect x='7' y='17.4' width='18' height='4.4' rx='2.2' fill='%234d9dff'/%3E%3Crect x='7' y='23.6' width='18' height='4.4' rx='2.2' fill='%23ffd23f'/%3E%3C/svg%3E">
  <title>Color Blind Runner · 颜色盲区</title>
  <style>
    /* ==========================================================================
       设计令牌（Design Tokens）
       仅承载视觉表现：颜色、字体、间距、圆角、阴影与动效时长。
       不包含任何玩法、规则或信息补偿逻辑。
       ========================================================================== */
    :root {
      /* 中性色阶 */
      --c-bg-0: #0a0c11;
      --c-bg-1: #0e1117;
      --c-bg-2: #12151d;
      --c-surface: rgba(255, 255, 255, 0.045);
      --c-surface-strong: rgba(255, 255, 255, 0.075);
      --c-hairline: rgba(255, 255, 255, 0.09);
      --c-hairline-strong: rgba(255, 255, 255, 0.16);

      /* 文本色阶 */
      --c-text: #eef1f7;
      --c-text-dim: #9aa3b5;
      --c-text-faint: #6b7484;

      /* 强调色（界面强调，非游戏颜色语义） */
      --c-accent: #6fa8ff;
      --c-accent-soft: rgba(111, 168, 255, 0.16);
      --c-danger: #ff6b6b;
      --c-danger-soft: rgba(255, 107, 107, 0.16);
      --c-success: #4ade80;
      --c-success-soft: rgba(74, 222, 128, 0.16);
      --c-warn: #fbbf24;
      --c-warn-soft: rgba(251, 191, 36, 0.16);

      /* 四种玩家颜色（与游戏规则一一对应） */
      --c-red: #ff4d6d;
      --c-green: #35d07f;
      --c-blue: #4d9dff;
      --c-yellow: #ffd23f;

      /* 字体 */
      --font-ui: system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      /* 数值字体：优先等宽（数字对齐稳定），回退到系统 UI 字体 */
      --font-num: Consolas, 'SF Mono', 'JetBrains Mono', 'Cascadia Mono', ui-monospace,
                  'Segoe UI', 'Microsoft YaHei', ui-sans-serif, sans-serif;

      /* 间距 */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 24px;
      --sp-6: 32px;

      /* 圆角 */
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 18px;
      --r-full: 999px;

      /* 投影 */
      --sh-stage: 0 30px 90px rgba(0, 0, 0, 0.55);
      --sh-panel: 0 10px 30px rgba(0, 0, 0, 0.35);

      /* 动效 */
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --dur-fast: 140ms;
      --dur-mid: 260ms;

      /* 游戏舞台实际可用高度（由 ViewportManager 实测写入），供调试与布局参考 */
      --stage-h: calc(100vh - 230px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--c-bg-0);
      color: var(--c-text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    /* --------------------------------------------------------------------------
       背景层：氛围光斑 + 暗角，仅供视觉包装，不参与游戏渲染
       -------------------------------------------------------------------------- */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(1100px 620px at 18% -8%, rgba(77, 157, 255, 0.16), transparent 62%),
        radial-gradient(900px 560px at 88% 108%, rgba(255, 77, 109, 0.12), transparent 60%),
        radial-gradient(760px 520px at 50% 50%, rgba(255, 255, 255, 0.03), transparent 70%),
        linear-gradient(180deg, var(--c-bg-1) 0%, var(--c-bg-0) 100%);
    }

    /* --------------------------------------------------------------------------
       页面骨架
       -------------------------------------------------------------------------- */
    .game-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: clamp(8px, 1.6vh, 18px) clamp(10px, 1.6vw, 22px);
      overflow: hidden;
    }

    /* 顶部：品牌标识 */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      width: 100%;
      max-width: 1280px;
      flex: 0 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      min-width: 0;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: 0 0 auto;
    }

    .brand-mark i {
      width: 7px;
      height: 7px;
      border-radius: var(--r-full);
      display: block;
    }

    .brand-mark i:nth-child(1) { background: var(--c-red); }
    .brand-mark i:nth-child(2) { background: var(--c-green); }
    .brand-mark i:nth-child(3) { background: var(--c-blue); }
    .brand-mark i:nth-child(4) { background: var(--c-yellow); }

    .brand-text {
      display: flex;
      align-items: baseline;
      gap: var(--sp-2);
      min-width: 0;
      white-space: nowrap;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0.04em;
      color: var(--c-text);
    }

    .brand-sub {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--c-text-faint);
    }

    /* 连接状态指示灯 */
    .conn {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      flex: 0 0 auto;
      padding: 5px 11px;
      border: 1px solid var(--c-hairline);
      border-radius: var(--r-full);
      background: var(--c-surface);
      font-size: 11px;
      color: var(--c-text-dim);
      white-space: nowrap;
      transition: color var(--dur-mid) var(--ease), border-color var(--dur-mid) var(--ease);
    }

    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: var(--r-full);
      background: var(--c-text-faint);
      flex: 0 0 auto;
      transition: background var(--dur-mid) var(--ease), box-shadow var(--dur-mid) var(--ease);
    }

    .conn[data-state="connecting"] .conn-dot {
      background: var(--c-warn);
      box-shadow: 0 0 0 0 var(--c-warn-soft);
      animation: conn-pulse 1.4s var(--ease) infinite;
    }

    .conn[data-state="online"] { color: var(--c-text); border-color: var(--c-hairline-strong); }
    .conn[data-state="online"] .conn-dot {
      background: var(--c-success);
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.7);
    }

    .conn[data-state="offline"] { color: var(--c-danger); border-color: rgba(255, 107, 107, 0.4); }
    .conn[data-state="offline"] .conn-dot {
      background: var(--c-danger);
      box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
    }

    @keyframes conn-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55); }
      50% { box-shadow: 0 0 0 5px rgba(251, 191, 36, 0); }
    }

    /* --------------------------------------------------------------------------
       状态栏（HUD）
       DOM 由 status-bar-renderer.ts 按数据增量更新，
       容器类名与 .status-section / .status-item 结构供 ViewportManager 复用。
       -------------------------------------------------------------------------- */
    /* 状态栏：一行呈现「人数 → 房间号 → 状态 → 数值」，对局中只保留人数与实时数值 */
    #statusBar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--sp-2) var(--sp-4);
      width: 100%;
      max-width: 1280px;
      flex: 0 0 auto;
      padding: 7px 14px;
      border: 1px solid var(--c-hairline);
      border-radius: var(--r-md);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.028));
      box-shadow: var(--sh-panel);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      font-size: 13px;
      transition: gap var(--dur-mid) var(--ease), padding var(--dur-mid) var(--ease),
                  border-color var(--dur-mid) var(--ease);
    }

    .status-section {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      flex-wrap: wrap;
      min-width: 0;
    }

    .status-section.game-stats {
      gap: var(--sp-4);
    }

    /* 房间号：靠右放置，对局中隐藏 */
    .status-section.basic-info {
      margin-left: auto;
    }

    .status-section.basic-info.hidden {
      display: none;
    }

    /* 状态栏内的通用单元 */
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      white-space: nowrap;
    }

    .status-label {
      color: var(--c-text-faint);
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    .status-value {
      color: var(--c-text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .status-value.mono { font-family: var(--font-num); letter-spacing: 0.02em; }
    .status-value.lg { font-size: 16px; font-weight: 700; }

    .status-divider {
      width: 1px;
      height: 16px;
      background: var(--c-hairline);
      flex: 0 0 auto;
    }

    /* 房间号徽标 */
    .room-chip {
      padding: 3px 9px;
      border: 1px solid var(--c-hairline);
      border-radius: var(--r-sm);
      background: rgba(0, 0, 0, 0.22);
      color: var(--c-text-dim);
      font-family: var(--font-num);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    /* 自身颜色指示 */
    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: var(--r-full);
      background: var(--c-text-faint);
      flex: 0 0 auto;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }

    .color-red { background: var(--c-red); }
    .color-green { background: var(--c-green); }
    .color-blue { background: var(--c-blue); }
    .color-yellow { background: var(--c-yellow); }

    .color-indicator .status-value { color: var(--c-text); }

    /* 玩家数：以点位表示占用情况 */
    .player-pips {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .player-pips i {
      width: 6px;
      height: 6px;
      border-radius: var(--r-full);
      background: var(--c-hairline-strong);
      display: block;
      transition: background var(--dur-mid) var(--ease), box-shadow var(--dur-mid) var(--ease);
    }

    .player-pips i.filled {
      background: var(--c-text-dim);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.18);
    }

    .count-badge {
      font-family: var(--font-num);
      font-size: 12px;
      color: var(--c-text-dim);
    }

    /* 状态胶囊 */
    .state-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border: 1px solid var(--c-hairline);
      border-radius: var(--r-full);
      background: rgba(0, 0, 0, 0.2);
      color: var(--c-text-dim);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: color var(--dur-mid) var(--ease), border-color var(--dur-mid) var(--ease),
                  background var(--dur-mid) var(--ease);
    }

    .state-pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: var(--r-full);
      background: currentColor;
      opacity: 0.85;
      flex: 0 0 auto;
    }

    .state-pill[data-tone="wait"] {
      color: var(--c-text-dim);
    }

    .state-pill[data-tone="ready"] {
      color: var(--c-success);
      border-color: rgba(74, 222, 128, 0.34);
      background: var(--c-success-soft);
    }

    .state-pill[data-tone="play"] {
      color: var(--c-accent);
      border-color: rgba(111, 168, 255, 0.34);
      background: var(--c-accent-soft);
    }

    .state-pill[data-tone="danger"] {
      color: var(--c-danger);
      border-color: rgba(255, 107, 107, 0.34);
      background: var(--c-danger-soft);
    }

    /* 倒计时 / 纪录等瞬时强调 */
    .countdown-highlight {
      padding: 3px 10px;
      border: 1px solid rgba(251, 191, 36, 0.34);
      border-radius: var(--r-full);
      background: var(--c-warn-soft);
      color: var(--c-warn) !important;
      animation: pulse 1s var(--ease) infinite;
    }

    .countdown-highlight .status-label,
    .countdown-highlight .status-value { color: var(--c-warn); }

    .death-status {
      padding: 3px 10px;
      border: 1px solid rgba(255, 107, 107, 0.34);
      border-radius: var(--r-full);
      background: var(--c-danger-soft);
    }

    .death-status .status-label,
    .death-status .status-value { color: var(--c-danger); }

    .new-record {
      padding: 3px 10px;
      border: 1px solid rgba(74, 222, 128, 0.34);
      border-radius: var(--r-full);
      background: var(--c-success-soft);
      animation: celebration 2s var(--ease);
    }

    .new-record .status-label,
    .new-record .status-value { color: var(--c-success); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.62; }
    }

    @keyframes celebration {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.04); }
      50% { transform: scale(1.08); }
      75% { transform: scale(1.04); }
    }

    /* --------------------------------------------------------------------------
       游戏舞台
       -------------------------------------------------------------------------- */
    .game-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
    }

    .game-stage::before {
      /* 画布下方的承托光晕 */
      content: '';
      position: absolute;
      left: 50%;
      bottom: -6%;
      width: min(760px, 70%);
      height: 160px;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(111, 168, 255, 0.14), transparent 72%);
      pointer-events: none;
      filter: blur(6px);
    }

    /* 画布显示尺寸：由 ViewportManager 实测舞台后写入像素级宽高（严格 16:9），
       内部绘制分辨率由 CanvasRenderer 按显示尺寸同步。
       注意：canvas 的固有宽高比会在 height:auto 时覆盖 aspect-ratio，故此处不使用 aspect-ratio。 */
    #gameCanvas {
      position: relative;
      z-index: 1;
      display: block;
      flex: 0 0 auto;
      max-width: 100%;
      max-height: 100%;
      border: 1px solid var(--c-hairline-strong);
      border-radius: var(--r-md);
      background: #0f1218;
      box-shadow: var(--sh-stage);
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
    }

    /* 触控反馈层：覆盖画布，不拦截指针事件（touch-feedback.ts 注入元素） */
    .touch-feedback-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      border-radius: var(--r-md);
    }

    .touch-feedback {
      position: absolute;
      border-radius: var(--r-full);
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: radial-gradient(closest-side, rgba(255, 255, 255, 0.22), transparent 70%);
      animation: ripple-out 600ms var(--ease) forwards;
      pointer-events: none;
    }

    @keyframes ripple-out {
      0% { transform: scale(0.35); opacity: 0.9; }
      100% { transform: scale(1); opacity: 0; }
    }

    .swipe-indicator {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 42px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      animation: indicator-fade 500ms var(--ease) forwards;
      pointer-events: none;
    }

    @keyframes indicator-fade {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* --------------------------------------------------------------------------
       底部操作区
       -------------------------------------------------------------------------- */
    .game-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-2);
      flex: 0 0 auto;
      width: 100%;
      max-width: 1280px;
    }

    .action-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      min-width: 220px;
      padding: 11px 28px;
      border: 1px solid var(--c-hairline-strong);
      border-radius: var(--r-full);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.085), rgba(255, 255, 255, 0.035));
      color: var(--c-text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0.02em;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: transform var(--dur-fast) var(--ease), background var(--dur-mid) var(--ease),
                  border-color var(--dur-mid) var(--ease), opacity var(--dur-mid) var(--ease),
                  box-shadow var(--dur-mid) var(--ease);
    }

    .action-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      color: var(--c-text-dim);
    }

    .action-btn:not(:disabled):hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
    }

    .action-btn:not(:disabled):active { transform: translateY(0) scale(0.985); }

    .action-btn:focus-visible {
      outline: 2px solid var(--c-accent);
      outline-offset: 3px;
    }

    .action-btn[data-variant="primary"] {
      border-color: rgba(74, 222, 128, 0.42);
      background: linear-gradient(180deg, rgba(74, 222, 128, 0.24), rgba(74, 222, 128, 0.1));
      color: #e6ffee;
      box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.25);
      animation: ready-glow 2.4s var(--ease) infinite;
    }

    .action-btn[data-variant="accent"] {
      border-color: rgba(111, 168, 255, 0.45);
      background: linear-gradient(180deg, rgba(111, 168, 255, 0.26), rgba(111, 168, 255, 0.1));
      color: #eaf2ff;
    }

    @keyframes ready-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.22); }
      50% { box-shadow: 0 0 0 9px rgba(74, 222, 128, 0); }
    }

    .action-hint {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--c-text-faint);
      min-height: 16px;
      text-align: center;
    }

    .action-hint kbd {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 2px;
      border: 1px solid var(--c-hairline-strong);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: var(--c-surface);
      color: var(--c-text-dim);
      font-family: var(--font-num);
      font-size: 10px;
    }

    /* --------------------------------------------------------------------------
       连接异常遮罩（仅网络状态提示，不承载游戏信息）
       -------------------------------------------------------------------------- */
    .conn-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--sp-5);
      background: rgba(6, 8, 12, 0.74);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .conn-overlay[data-visible="true"] { display: flex; }

    .conn-card {
      width: min(360px, 100%);
      padding: var(--sp-5);
      border: 1px solid var(--c-hairline-strong);
      border-radius: var(--r-lg);
      background: linear-gradient(180deg, rgba(24, 28, 38, 0.98), rgba(14, 17, 23, 0.98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .conn-card h2 {
      font-size: 16px;
      font-weight: 650;
      margin-bottom: var(--sp-2);
    }

    .conn-card p {
      font-size: 13px;
      color: var(--c-text-dim);
      margin-bottom: var(--sp-4);
    }

    #status:empty { display: none; }

    /* --------------------------------------------------------------------------
       响应式：窄屏 / 触控设备
       -------------------------------------------------------------------------- */
    @media (max-width: 720px) {
      .brand-sub { display: none; }
      .game-wrapper { gap: var(--sp-2); }

      #statusBar {
        gap: 6px var(--sp-2);
        padding: 6px 10px;
        font-size: 12px;
        border-radius: var(--r-sm);
      }

      .status-section { gap: var(--sp-2); }
      .status-section.game-stats,
      .status-section.result-stats { gap: var(--sp-3); }
      .status-value.lg { font-size: 14px; }

      .action-btn {
        min-width: 0;
        width: 100%;
        max-width: 420px;
        padding: 12px 20px;
      }
    }

    /* 竖向窄屏：状态栏改为纵向堆叠（由 ViewportManager 同步设置内联样式） */
    #statusBar.mobile-layout {
      flex-direction: column;
      align-items: stretch;
      font-size: 12px;
      padding: 7px 10px;
    }

    /* 窄屏下「人数 / 房号 / 状态」同处一行，紧凑且不溢出 */
    #statusBar.mobile-layout .status-section {
      justify-content: flex-start;
      width: 100%;
      gap: 6px var(--sp-3);
    }

    /* 人数与数值同处一行 */
    #statusBar.mobile-layout .status-section.game-stats {
      flex-wrap: wrap;
      justify-content: space-between;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--c-hairline);
    }

    #statusBar.mobile-layout .status-section.basic-info {
      margin-left: 0;
    }

    #statusBar.landscape-compact {
      padding: 4px 10px;
      font-size: 11px;
    }

    #statusBar.landscape-compact .status-section.basic-info { display: none; }

    .status-section.result-stats {
      flex: 0 1 auto;
      gap: var(--sp-4);
      min-width: 0;
    }

    @media (hover: none) and (pointer: coarse) {
      #gameCanvas { border-radius: var(--r-sm); }
      .touch-feedback-layer { border-radius: var(--r-sm); }
      .status-label { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }

    /* 极矮视口（如横屏手机）：压缩非必要元素以保住画布高度 */
    @media (max-height: 460px) {
      .game-header { display: none; }
      .action-hint { display: none; }
      .game-wrapper { gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <div class="game-wrapper">
    <!-- 顶部：品牌 + 连接状态 -->
    <header class="game-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-text">
          <span class="brand-name">Color Blind Runner</span>
          <span class="brand-sub">COLOR BLIND RUNNER</span>
        </span>
      </div>
      <div class="conn" id="connIndicator" data-state="connecting" role="status" aria-live="polite">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="connText">连接中…</span>
      </div>
    </header>

    <!-- 状态栏：由 status-bar-renderer.ts 按数据增量填充 -->
    <div id="statusBar"></div>

    <!-- 游戏舞台 -->
    <div class="game-stage">
      <canvas id="gameCanvas" width="1280" height="720" aria-label="游戏画面"></canvas>
      <div class="touch-feedback-layer" id="touchFeedbackLayer" aria-hidden="true"></div>
    </div>

    <!-- 底部操作区 -->
    <footer class="game-footer">
      <button type="button" class="action-btn" id="actionBtn" disabled>连接中…</button>
      <div class="action-hint" id="actionHint"></div>
    </footer>
  </div>

  <!-- 网络异常提示 -->
  <div class="conn-overlay" id="connOverlay" role="alertdialog" aria-live="assertive">
    <div class="conn-card">
      <h2>连接已断开</h2>
      <p id="connOverlayText">与服务器的连接中断，请刷新页面重新进入。</p>
      <button type="button" class="action-btn" id="reloadBtn" data-variant="accent">刷新页面</button>
    </div>
  </div>

  <div id="status"></div>
  <script type="module" src="/dist/client/index.js"></script>
</body>
</html>
